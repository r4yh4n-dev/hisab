  /** move the widget to another month and repaint just the widget */
  function widgetGoMonth(delta) {
    var cur = UI.wgMonth || todayIso().slice(0, 7);
    var next = monthKeyShift(cur, delta);
    if (next > todayIso().slice(0, 7)) return;   /* never past the current month */
    UI.wgMonth = next;
    var wg = $('#wg');
    if (!wg) { renderHome(true); return; }
    var flipped = wg.classList.contains('flipped');
    var host = wg.parentNode;
    var tmp = document.createElement('div');
    tmp.innerHTML = widgetHTML();
    var fresh = tmp.firstChild;
    if (flipped) fresh.classList.add('flipped');
    host.replaceChild(fresh, wg);
    paintWidget();
    bindWidgetSwipe(fresh);
  }

  /** horizontal swipe on the widget moves between months */
  function bindWidgetSwipe(wg) {
    if (!wg) return;
    var x0 = 0, y0 = 0, lock = null, active = false;
    wg.addEventListener('touchstart', function (e) {
      if (!e.touches || e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      lock = null; active = true;
    }, { passive: true });
    wg.addEventListener('touchmove', function (e) {
      if (!active || !e.touches || !e.touches.length) return;
      var dx = e.touches[0].clientX - x0;
      var dy = e.touches[0].clientY - y0;
      if (lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        lock = Math.abs(dx) > Math.abs(dy) + 3 ? 'x' : 'y';
      }
      if (lock !== 'x') return;
      /* elastic resistance while dragging */
      var eased = Math.sign(dx) * Math.min(26, Math.abs(dx) * 0.28);
      wg.style.transform = 'translateX(' + eased + 'px)';
    }, { passive: true });
    wg.addEventListener('touchend', function (e) {
      if (!active) return;
      active = false;
      wg.style.transition = 'transform .4s var(--spring)';
      wg.style.transform = '';
      setTimeout(function () { wg.style.transition = ''; }, 420);
      if (lock !== 'x') return;
      var t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      var dx = t.clientX - x0;
      if (Math.abs(dx) < 46) return;
      haptic('light');
      widgetGoMonth(dx < 0 ? 1 : -1);
    });
  }

  /* ---- swipe gestures on transaction rows ---- */
  function bindSwipes(root) {
    $$('.swipe-wrap', root).forEach(function (wrap) {
      var row = wrap.querySelector('.tx-row');
      if (!row) return;
      var startX = 0, startY = 0, dx = 0, active = false, lock = null;

      row.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        dx = 0; active = true; lock = null;
        row.classList.add('dragging');
      }, { passive: true });

      row.addEventListener('touchmove', function (e) {
        if (!active) return;
        var cx = e.touches[0].clientX, cy = e.touches[0].clientY;
        if (lock === null && (Math.abs(cx - startX) > 7 || Math.abs(cy - startY) > 7)) {
          lock = (Math.abs(cx - startX) > Math.abs(cy - startY) + 3) ? 'x' : 'y';
        }
        if (lock !== 'x') return;
        /* elastic resistance once past the action threshold, so the row feels
           weighted instead of sliding freely */
        var raw = cx - startX;
        var over = Math.max(0, Math.abs(raw) - 68);
        var eased = Math.sign(raw) * Math.min(110, Math.abs(raw) - over * 0.55);
        dx = clamp(eased, -110, 110);
        row.style.transform = 'translateX(' + dx + 'px)';
      }, { passive: true });

      row.addEventListener('touchend', function () {
        if (!active) return;
        active = false;
        row.classList.remove('dragging');
        if (lock === 'x' && Math.abs(dx) > 68) {
          lastSwipeAt = Date.now();
          if (dx > 0) openTxSheet(wrap.getAttribute('data-id'));
          else confirmDeleteTx(wrap.getAttribute('data-id'));
        }
        row.style.transform = '';
      });
    });
  }

  /** the typed amount, grouped for display (keeps a trailing "." while typing) */
  function typedAmount(str) {
    var parts = String(str).split('.');
    var intPart = parts[0] === '' ? '0' : parts[0];
    var out = groupIndian(intPart);
    if (parts.length > 1) out += '.' + parts[1];
    return out;
  }

  /** move a .seg pill to slot i of n */
  function positionSegPill(seg, i) {
    var pill = seg.querySelector('.seg-pill');
    if (!pill) return;
    var n = seg.querySelectorAll('button').length || 1;
    var w = (seg.clientWidth - 8 - (n - 1) * 4) / n;
    pill.style.width = Math.max(0, w) + 'px';
    pill.style.transform = 'translateX(' + (i * (w + 4)) + 'px)';
  }

  /** keyboard typing while the tx sheet is open */
  function txKey(k) {
    var d = UI.txDraft;
    if (!d) return;
    if (k === 'del') {
      d.amountStr = d.amountStr.slice(0, -1);
    } else if (k === '.') {
      if (d.amountStr.indexOf('.') === -1) d.amountStr = (d.amountStr || '0') + '.';
    } else {
      if (d.amountStr.length >= 10) return;
      if (d.amountStr === '0') d.amountStr = k;
      else d.amountStr = (d.amountStr || '') + k;
      /* keep at most 2 decimals */
      var dot = d.amountStr.indexOf('.');
      if (dot > -1 && d.amountStr.length - dot > 3) d.amountStr = d.amountStr.slice(0, dot + 3);
    }
    paintTxSheet();
  }

  function reportRange(period) {
    var today = todayIso();
    if (period === 'daily') return { from: today, to: today };
    if (period === 'weekly') return { from: shiftIso(today, -6), to: today };
    if (period === 'yearly') return { from: today.slice(0, 4) + '-01-01', to: today };
    return { from: today.slice(0, 8) + '01', to: today };   /* monthly */
  }

  function reportBuckets(period, list, range) {
    var buckets = [];
    var today = todayIso();
    if (period === 'weekly') {
      for (var i = 6; i >= 0; i--) {
        var d = shiftIso(today, -i);
        buckets.push({ key: d, label: dayLabel(d), txs: [] });
      }
      list.forEach(function (tx) {
        buckets.forEach(function (b) { if (b.key === tx.date) b.txs.push(tx); });
      });
    } else if (period === 'yearly') {
      var y = Number(today.slice(0, 4));
      for (var m = 0; m < 12; m++) {
        buckets.push({ key: y + '-' + String(m + 1).padStart(2, '0'), label: T.__months[S.settings.lang === 'en' ? 1 : 0][m], txs: [] });
      }
      list.forEach(function (tx) {
        var mk = tx.date.slice(0, 7);
        buckets.forEach(function (b) { if (b.key === mk) b.txs.push(tx); });
      });
    } else if (period === 'monthly') {
      var spans = [[1, 7], [8, 14], [15, 21], [22, 28], [29, 31]];
      spans.forEach(function (sp) {
        buckets.push({ key: sp[0] + '-' + sp[1], label: num(sp[0]) + '–' + num(sp[1]), txs: [] });
      });
      list.forEach(function (tx) {
        var day = Number(tx.date.slice(8, 10));
        for (var i = 0; i < spans.length; i++) {
          if (day >= spans[i][0] && day <= spans[i][1]) { buckets[i].txs.push(tx); break; }
        }
      });
    } else {
      buckets.push({ key: 'today', label: t('today'), txs: list.slice() });
    }
    return buckets;
  }

  function renderReports() {
    var host = document.getElementById('view-reports');
    if (!host) return;
    var period = UI.repPeriod;
    var range = reportRange(period);
    var list = S.txs.filter(function (tx) { return tx.date >= range.from && tx.date <= range.to; });
    var s = sumOf(list);
    var days = Math.max(1, dayDiff(range.to, range.from) + 1);
    var byCat = categoryTotals('expense', list);
    var buckets = reportBuckets(period, list, range);

    var periods = [['daily', 'daily'], ['weekly', 'weekly'], ['monthly', 'monthly'], ['yearly', 'yearly']];

    var html = '';

    /* period segmented */
    html += '<div class="seg" id="repSeg">' +
      '<span class="seg-pill"></span>' +
      periods.map(function (p, i) {
        return '<button type="button" data-period="' + p[0] + '"' + (period === p[0] ? ' class="on"' : '') + '>' + esc(t(p[1])) + '</button>';
      }).join('') + '</div>';

    html += '<p style="font-size:12px;color:var(--text-3);text-align:center;margin:12px 0 14px;">' +
      esc(dateRangeLabel(range.from, range.to)) + '</p>';

    /* summary */
    html += '<div class="grid2">' +
      '<div class="card mini"><div class="m-lab">' + esc(t('income')) + '</div><div class="m-val" style="color:var(--income)">' + money(s.income) + '</div></div>' +
      '<div class="card mini"><div class="m-lab">' + esc(t('expense')) + '</div><div class="m-val" style="color:var(--expense)">' + money(s.expense) + '</div></div>' +
      '<div class="card mini"><div class="m-lab">' + esc(t('net_saving')) + '</div><div class="m-val" style="color:' + (s.net >= 0 ? 'var(--income)' : 'var(--expense)') + '">' + money(s.net) + '</div></div>' +
      '<div class="card mini"><div class="m-lab">' + esc(t('transactions_count')) + '</div><div class="m-val">' + num(list.length) + '</div></div>' +
    '</div>';

    html += '<div class="card mini mt12" style="display:flex;align-items:center;justify-content:space-between;">' +
      '<span class="m-lab">' + esc(t('avg_per_day')) + '</span>' +
      '<span class="m-val">' + money(s.expense / days) + '</span></div>';

    /* per-bucket rows */
    html += '<div class="sec-head"><span class="sec-title">' + esc(t('summary')) + '</span></div>';
    var nonEmpty = buckets.filter(function (b) { return b.txs.length; });
    if (!nonEmpty.length) {
      html += '<div class="card">' + emptyHTML('📊', t('no_data'), '') + '</div>';
    } else {
      html += '<div class="list">' + nonEmpty.map(function (b) {
        var bs = sumOf(b.txs);
        return '<div class="report-row">' +
          '<span class="rr-lab"><span class="rr-t">' + esc(b.label) + '</span>' +
          '<span class="rr-s">+' + money(bs.income) + ' · −' + money(bs.expense) + '</span></span>' +
          '<span class="rr-net ' + (bs.net >= 0 ? 'in' : 'ex') + '">' + money(bs.net) + '</span>' +
        '</div>';
      }).join('') + '</div>';
    }

    /* category breakdown bars */
    html += '<div class="sec-head"><span class="sec-title">' + esc(t('breakdown')) + '</span></div>';
    if (!byCat.length) {
      html += '<div class="card">' + emptyHTML('🧾', t('no_data'), '') + '</div>';
    } else {
      var maxVal = byCat[0].value || 1;
      html += '<div class="card">' + byCat.map(function (c) {
        var share = s.expense ? (c.value / s.expense) * 100 : 0;
        return '<div class="bar-row">' +
          '<span class="bar-lab">' + esc(c.emoji + ' ' + c.label) + '</span>' +
          '<span class="bar-track"><span class="bar-fill" style="background:' + c.color + ';width:' + ((c.value / maxVal) * 100) + '%"></span></span>' +
          '<span class="bar-val">' + money(c.value) + '<br><span style="font-size:10.5px;color:var(--text-3);font-weight:600">' + pct(share) + '</span></span>' +
        '</div>';
      }).join('') + '</div>';
    }

    /* budget section */
    html += renderBudgetSection();

    /* export row */
    html += '<div class="row mt16 no-print" style="gap:10px;">' +
      '<button class="btn btn-ghost grow" type="button" data-act="export-csv">📄 ' + esc(t('export_csv')) + '</button>' +
      '<button class="btn btn-primary grow" type="button" data-act="print-report">🖨️ ' + esc(t('print_pdf')) + '</button>' +
    '</div>';
    html += '<p style="font-size:11.5px;color:var(--text-3);text-align:center;margin:10px 0 0;" class="no-print">' + esc(t('print_hint')) + '</p>';

    host.innerHTML = html;
    var seg = $('#repSeg');
    if (seg) positionSegPill(seg, periods.map(function (p) { return p[0]; }).indexOf(period));
  }

  function renderBudgetSection() {
    var mk = todayIso().slice(0, 7);
    var mTxs = S.txs.filter(function (tx) { return tx.type === 'expense' && inMonth(tx.date, mk); });
    var spentByCat = {};
    mTxs.forEach(function (tx) {
      spentByCat[tx.categoryId] = (spentByCat[tx.categoryId] || 0) + tx.amount;
    });
    var budgeted = Object.keys(S.budgets).filter(function (k) { return S.budgets[k] > 0; });
    var totalBudget = budgeted.reduce(function (a, k) { return a + S.budgets[k]; }, 0);
    var totalSpent = budgeted.reduce(function (a, k) { return a + (spentByCat[k] || 0); }, 0);
    var ratio = totalBudget ? totalSpent / totalBudget : 0;
    var color = ratio >= 1 ? 'var(--expense)' : (ratio >= 0.8 ? 'var(--warn)' : 'var(--income)');

    var html = '<div class="sec-head"><span class="sec-title">' + esc(t('budget')) + '</span>' +
      '<button class="sec-link" type="button" data-act="edit-budget">' + esc(t('set_budget')) + '</button></div>';

    html += '<div class="card">';
    if (!budgeted.length) {
      html += emptyHTML('🎯', t('budget_none'), t('budget_none_sub'));
    } else {
      html += '<div class="budget-ring"><canvas id="budgetRing" role="img" aria-label="' + esc(t('budget')) + '"></canvas>' +
        '<div class="br-center"><div><div class="br-pct" style="color:' + color + '">' + pct(ratio * 100) + '</div>' +
        '<div class="br-lab">' + esc(t('budget_used')) + '</div></div></div></div>';
      html += '<div style="text-align:center;margin:12px 0 4px;">' +
        '<div style="font-size:14px;font-weight:700">' + money(totalSpent) + ' / ' + money(totalBudget) + '</div>' +
        '<div style="font-size:12px;color:var(--text-3)">' +
          (ratio >= 1 ? esc(t('budget_over')) + ' ' + money(totalSpent - totalBudget)
                      : esc(t('budget_left')) + ' ' + money(totalBudget - totalSpent)) +
        '</div></div>';

      html += budgeted.map(function (k) {
        var c = catById(k);
        var spent = spentByCat[k] || 0;
        var lim = S.budgets[k];
        var r = lim ? spent / lim : 0;
        var col = r >= 1 ? 'var(--expense)' : (r >= 0.8 ? 'var(--warn)' : c.color);
        return '<div class="budget-row">' +
          '<span class="b-lab">' + esc(c.emoji + ' ' + catName(c)) + '</span>' +
          '<span class="b-mid"><span class="bar-track"><span class="bar-fill" style="background:' + col + ';width:' + clamp(r * 100, 0, 100) + '%"></span></span>' +
          '<span class="b-num">' + money(spent) + ' / ' + money(lim) + '</span></span>' +
          '<span style="font-size:12.5px;font-weight:700;color:' + col + ';min-width:42px;text-align:right">' + pct(r * 100) + '</span>' +
        '</div>';
      }).join('');
    }
    html += '</div>';
    return html;
  }

  function exportCSV() {
    var period = UI.repPeriod;
    var range = reportRange(period);
    var list = S.txs.filter(function (tx) { return tx.date >= range.from && tx.date <= range.to; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var rows = [['Date', 'Type', 'Category', 'Amount', 'Method', 'Note']];
    list.forEach(function (tx) {
      var c = catById(tx.categoryId);
      rows.push([
        tx.date,
        tx.type,
        (c.en || c.bn),
        money(tx.amount, { plain: true, sym: false }),
        methodById(tx.method).en,
        (tx.noteEn || tx.noteBn || '')
      ]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var ok = download('hisab-' + period + '-' + todayIso() + '.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
    toast(ok ? t('csv_done') : t('import_bad'), ok ? 'ok' : 'warn');
  }

  function showLock(mode) {
    UI.pinMode = mode || 'unlock';
    UI.pinBuf = '';

    var lock = $('#lock');
    if (!lock) return;
    lock.classList.remove('hide');
    var lt = $('#lockTitle'), lm = $('#lockMsg');
    if (lt) lt.textContent = UI.pinMode === 'set' ? t('pin_enter_new') : t('pin_enter');
    if (lm) lm.textContent = UI.pinMode === 'set' ? t('pin_saved') : t('pin_unlock_sub');
    paintDots();
  }

  function hideLock() {
    var lock = $('#lock');
    if (lock) lock.classList.add('hide');
  }

  function paintDots() {
    var dots = $('#lockDots');
    if (!dots) return;
    $$('i', dots).forEach(function (d, i) {
      d.classList.toggle('on', i < UI.pinBuf.length);
    });
  }

  function shakeDots() {
    var dots = $('#lockDots');
    if (!dots) return;
    dots.classList.add('shake');
    setTimeout(function () { dots.classList.remove('shake'); }, 520);
  }

  /** wrong PIN: shake + red glow pulse + error buzz */
  function pinError() {
    shakeDots();
    haptic('error');
    var lock = $('#lock');
    if (lock) {
      lock.classList.add('err');
      setTimeout(function () { lock.classList.remove('err'); }, 620);
    }
    toast(t('pin_wrong'), 'warn');
  }

  function pinKey(k) {
    var lock = $('#lock');
    if (!lock || lock.classList.contains('hide')) return;
    if (k === 'del') { UI.pinBuf = UI.pinBuf.slice(0, -1); paintDots(); return; }
    if (k === 'ok') { submitPin(); return; }
    if (UI.pinBuf.length >= 4) return;
    UI.pinBuf += k;
    paintDots();
    if (UI.pinBuf.length === 4) setTimeout(submitPin, 160);
  }

  function submitPin() {
    var entered = UI.pinBuf;
    if (entered.length !== 4) { shakeDots(); return; }

    if (UI.pinMode === 'unlock') {
      if (entered === S.settings.pin) {
        hideLock();
        haptic('success');
        toast(t('done'));
      } else {
        pinError();
      }
      UI.pinBuf = '';
      paintDots();
      return;
    }

    if (UI.pinMode === 'set') {
      UI.pinFirst = entered;
      UI.pinBuf = '';
      UI.pinMode = 'confirm';
      paintDots();
      var lt = $('#lockTitle');
      if (lt) lt.textContent = t('pin_enter_new');
      var lm = $('#lockMsg');
      if (lm) lm.textContent = t('pin_saved');
      return;
    }

    if (UI.pinMode === 'confirm') {
      if (entered === UI.pinFirst) {
        S.settings.pin = entered;
        S.settings.pinOn = true;
        save(true);
        hideLock();
        toast(t('pin_saved'));
        UI.pinMode = 'unlock';
        renderCurrent(true);
      } else {
        pinError();
        UI.pinMode = 'set';
        UI.pinFirst = null;
      }
      UI.pinBuf = '';
      paintDots();
    }
  }

  /** a completely blank state — used by "reset all data" */
  function freshEmptyState() {

  /* ======================================================================
     3.12  PWA — install prompt, iOS hint, service worker, update toast
     ----------------------------------------------------------------------
     Everything here is defensive: a browser without service workers, a
     file:// preview inside Acode, or a blocked install prompt must never
     stop the app from working. Each entry point is feature-checked and
     wrapped in try/catch.
     ====================================================================== */
  var PWA = {
    deferred: null,     /* the captured beforeinstallprompt event */
    installed: false,   /* true once the app is running installed */
    dismissed: false    /* user closed the banner — remembered */
  };

  var PWA_DISMISS_KEY = 'hisab-install-dismissed';

  try { PWA.dismissed = localStorage.getItem(PWA_DISMISS_KEY) === '1'; } catch (err) { PWA.dismissed = false; }

  /* ---- am I already running as an installed app? ---- */
  function isStandalone() {
    try {
      if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
      if (window.navigator.standalone === true) return true;   /* iOS Safari */
    } catch (err) { /* fall through */ }
    return false;
  }

  /* ---- iPhone / iPad detection (beforeinstallprompt never fires there) ---- */
  function isIOS() {
    var ua = navigator.userAgent || '';
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    /* iPadOS 13+ reports itself as a Mac — the touch points give it away */
    return navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  }

  /* ---- show / hide the glass banner ---- */
  function refreshInstallUI() {
    var banner = document.getElementById('installBanner');
    if (!banner) return;

    var onHomeOrSettings = (UI.view === 'home' || UI.view === 'settings');
    var canPrompt = !!PWA.deferred;                       /* Android / Chrome */
    var needsIosHint = isIOS() && !isStandalone();        /* iPhone Safari    */

    var show = !PWA.installed && !PWA.dismissed && onHomeOrSettings &&
               (canPrompt || needsIosHint);

    if (!show) { banner.classList.remove('show'); return; }

    var titleEl = document.getElementById('ibTitle');
    var subEl = document.getElementById('ibSub');
    var btnEl = document.getElementById('ibBtn');

    if (canPrompt) {
      if (titleEl) titleEl.textContent = t('install_title');
      if (subEl) subEl.textContent = t('install_sub');
      if (btnEl) btnEl.textContent = t('install_btn');
    } else {
      if (titleEl) titleEl.textContent = t('ios_title');
      if (subEl) subEl.textContent = t('ios_sub');
      if (btnEl) btnEl.textContent = t('ios_btn');
    }

    banner.classList.add('show');
  }

  /* ---- the install button ---- */
  function doInstall() {
    haptic('light');

    if (PWA.deferred) {
      var ev = PWA.deferred;
      PWA.deferred = null;
      try {
        ev.prompt();
        if (ev.userChoice && ev.userChoice.then) {
          ev.userChoice.then(function (res) {
            if (res && res.outcome === 'accepted') PWA.installed = true;
            refreshInstallUI();
          }).catch(function () { refreshInstallUI(); });
        } else {
          refreshInstallUI();
        }
      } catch (err) {
        refreshInstallUI();
      }
      return;
    }

    /* no prompt available (iPhone) — explain the Share sheet instead */
    toast(t('ios_how'));
  }

  /* ---- dismiss the banner for good ---- */
  function dismissInstall() {
    haptic('light');
    PWA.dismissed = true;
    try { localStorage.setItem(PWA_DISMISS_KEY, '1'); } catch (err) { /* private mode */ }
    refreshInstallUI();
  }

  /* ---- capture the Android install prompt ---- */
  window.addEventListener('beforeinstallprompt', function (e) {
    try { e.preventDefault(); } catch (err) { /* ignore */ }
    PWA.deferred = e;
    refreshInstallUI();
  });

  window.addEventListener('appinstalled', function () {
    PWA.deferred = null;
    PWA.installed = true;
    refreshInstallUI();
    toast(t('install_done'));
  });

  /* ---- "Update available" toast, driven by the service worker ---- */
  function showUpdateToast(worker) {
    if (!toastsEl) return;
    if (document.getElementById('swUpdateToast')) return;

    var el = document.createElement('div');
    el.className = 'toast toast-update';
    el.id = 'swUpdateToast';
    el.innerHTML = '<span>' + esc(t('update_ready')) + '</span>' +
      '<button class="toast-btn" type="button">' + esc(t('update_btn')) + '</button>';
    toastsEl.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });

    var btn = el.querySelector('.toast-btn');
    if (btn) {
      btn.addEventListener('click', function () {
        haptic('light');
        try { if (worker) worker.postMessage({ type: 'SKIP_WAITING' }); } catch (err) { /* ignore */ }
        setTimeout(function () { try { location.reload(); } catch (err) {} }, 140);
      });
    }
  }

  /* ---- register the service worker (safe: feature-checked + try/catch) ---- */
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;          /* unsupported browser */
    if (location.protocol === 'file:') return;            /* Acode preview — no SW on file:// */

    try {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        /* a worker is already waiting from a previous visit */
        if (reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg.waiting);

        reg.addEventListener('updatefound', function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateToast(nw);
            }
          });
        });
      }).catch(function () { /* offline or blocked — the app still works */ });
    } catch (err) { /* never let the SW break the app */ }
  }

  /* ---- wire the banner buttons once ---- */
  function initPWA() {
    var btn = document.getElementById('ibBtn');
    var close = document.getElementById('ibClose');
    if (btn) btn.addEventListener('click', doInstall);
    if (close) close.addEventListener('click', dismissInstall);

    /* manifest shortcuts: ./index.html?action=expense | ?action=income */
    try {
      var action = null;
      if (window.location.search) {
        action = new URLSearchParams(window.location.search).get('action');
      }
      if (action === 'expense' || action === 'income') {
        setTimeout(function () { openTxSheet(null, action); }, 420);
      }
    } catch (err) { /* URLSearchParams missing — ignore */ }

    refreshInstallUI();

    /* register the service worker on window load (with a fallback for the
       case where load has already fired by the time we get here) */
    if (document.readyState === 'complete') {
      registerSW();
    } else {
      window.addEventListener('load', registerSW);
    }
  }

  function boot() {
    S = loadState();
    if (!S.settings.seeded) { S.settings.seeded = true; }
    save(true);

    /* first paint = skeletons so the app never flashes empty */
    var homeHost = document.getElementById('view-home');
    if (homeHost) {
      homeHost.innerHTML =
        '<div class="skel" style="height:150px;border-radius:28px;margin-bottom:14px;"></div>' +
        '<div class="skel" style="height:92px;border-radius:22px;margin-bottom:14px;"></div>' +
        skeletonHTML(4);
    }

    /* interface state (declared here so the whole file can use it) */
    UI.view = 'home';
    UI.txDraft = null;
    UI.catDraft = null;
    UI.personDraft = null;
    UI.entryDraft = null;
    UI.pinMode = 'unlock';
    UI.pinBuf = '';
    UI.pinFirst = null;
    UI.catManage = false;
    UI.txSearchFocus = false;
    UI.repPeriod = 'monthly';
    UI.wgMonth = todayIso().slice(0, 7);   /* v2: month shown by the summary widget */
    UI.txFilter = { q: '', type: 'all', cat: 'all', method: 'all', range: 'all' };

    applySettings(true);
    localizeDigits();
    go('home');
    onScroll();
    bindPullToRefresh();
    initPWA();

    /* PIN gate */
    if (S.settings.pinOn && S.settings.pin) {
      showLock('unlock');
    }
  }

  /* UI state object — declared before boot() runs */
  var UI = {};

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
