<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="হিসাব">
  <title>হিসাব · Hisab</title>
  <defs>
    <!-- indigo -> teal brand gradient -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B79F5"/>
      <stop offset=".42" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- soft top-left light reflection (the "liquid glass" sheen) -->
    <radialGradient id="sheen" cx=".26" cy=".16" r=".92">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 1px inner light border -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".10"/>
    </linearGradient>

    <!-- glass highlight across the top third -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- soft glow behind the taka sign -->
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- clip so the glass highlight stays inside the squircle -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <!-- base squircle -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#brand)"/>

  <g clip-path="url(#squircle)">
    <!-- light reflection -->
    <rect x="0" y="0" width="512" height="512" fill="url(#sheen)"/>
    <!-- glass highlight band -->
    <rect x="0" y="0" width="512" height="210" fill="url(#glass)"/>
    <!-- faint diagonal glass streak -->
    <path d="M-40 300 L300 -40 L392 -40 L52 300 Z" fill="#ffffff" opacity=".07"/>
  </g>

  <!-- 1px inner light border -->
  <rect x="5" y="5" width="502" height="502" rx="112" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- glass taka sign with soft glow -->
  <text x="256" y="356" text-anchor="middle"
        font-family="'Hind Siliguri','Noto Sans Bengali','Nirmala UI',sans-serif"
        font-size="300" font-weight="700" fill="#ffffff"
        filter="url(#glow)">৳</text>
</svg>
